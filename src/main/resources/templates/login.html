<!doctype html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <h1>Welcome</h1>
    <form method="post" action="login">
        <fieldset>
            <legend>로그인 폼</legend>
            <div>
                <label for="userId">사용자 ID</label>
                <input type="text" name="userId" id="userId" value="" required><br />
                <label for="userPwd">사용자 비밀번호</label>
                <input type="password" name="userPwd" id="userPwd" value="" required><br />
                <input type="submit" value="Send">
                <a href="/joinform" target="_self">회원가입</a>
            </div>
        </fieldset>
    </form>
</body>

</html
